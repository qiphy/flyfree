name: Fetch Flights

on:
  schedule:
    # Runs every hour; each run handles 1 of 7 route groups
    # Full cycle: all 39 routes refreshed every 7 hours
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "Route group (0-6), or leave empty for all"
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Determine group index
        id: group
        run: |
          if [ -n "${{ github.event.inputs.group }}" ]; then
            echo "index=${{ github.event.inputs.group }}" >> $GITHUB_OUTPUT
          else
            # Rotate through groups 0-6 based on current hour
            echo "index=$(( $(date +%-H) % 7 ))" >> $GITHUB_OUTPUT
          fi

      - name: Fetch route group
        run: python main.py --group ${{ steps.group.outputs.index }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_PRICE_MYR: "50"
          SEARCH_DAYS_AHEAD: "15"
